<svg width="600" height="400" viewBox="0 0 600 400"
    xmlns="http://www.w3.org/2000/svg">
    <!-- Background -->
    <rect width="600" height="400" fill="#f8f9fa"/>

    <!-- Main container -->
    <rect x="50" y="50" width="500" height="300" rx="20" fill="#ffffff" stroke="#C01722" stroke-width="3"/>

    <!-- Books stack -->
    <rect x="100" y="150" width="80" height="10" rx="2" fill="#C01722"/>
    <rect x="105" y="140" width="80" height="10" rx="2" fill="#E63946"/>
    <rect x="110" y="130" width="80" height="10" rx="2" fill="#F1FAEE"/>

    <!-- Computer/Learning icon -->
    <rect x="250" y="120" width="120" height="80" rx="8" fill="#457B9D"/>
    <rect x="260" y="130" width="100" height="60" rx="4" fill="#1D3557"/>
    <circle cx="310" cy="160" r="15" fill="#F1FAEE"/>
    <text x="310" y="165" text-anchor="middle" fill="#1D3557" font-family="Arial" font-size="14" font-weight="bold">▶</text>

    <!-- Achievement/Certificate -->
    <rect x="420" y="140" width="60" height="40" rx="4" fill="#F77F00"/>
    <circle cx="450" cy="160" r="8" fill="#FCBF49"/>
    <text x="450" y="165" text-anchor="middle" fill="#F77F00" font-family="Arial" font-size="10" font-weight="bold">★</text>

    <!-- Progress indicators -->
    <circle cx="150" cy="250" r="8" fill="#2A9D8F"/>
    <circle cx="200" cy="250" r="8" fill="#2A9D8F"/>
    <circle cx="250" cy="250" r="8" fill="#2A9D8F"/>
    <circle cx="300" cy="250" r="8" fill="#E9C46A"/>
    <circle cx="350" cy="250" r="8" fill="#E5E5E5"/>

    <!-- Connection lines -->
    <line x1="158" y1="250" x2="192" y2="250" stroke="#2A9D8F" stroke-width="3"/>
    <line x1="208" y1="250" x2="242" y2="250" stroke="#2A9D8F" stroke-width="3"/>
    <line x1="258" y1="250" x2="292" y2="250" stroke="#E9C46A" stroke-width="3"/>
    <line x1="308" y1="250" x2="342" y2="250" stroke="#E5E5E5" stroke-width="3"/>

    <!-- Title -->
    <text x="300" y="90" text-anchor="middle" fill="#1D3557" font-family="Arial" font-size="24" font-weight="bold">Professional Training</text>

    <!-- Subtitle -->
    <text x="300" y="320" text-anchor="middle" fill="#457B9D" font-family="Arial" font-size="16">Enhance your skills and advance your career</text>
</svg>
