services:
  app:
    image: proj3twildfly:latest
    build:
      context: ./wildfly
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
      - "8443:8443"
      - "9990:9990"
    volumes:
      # Production absolute paths
      - /home/admin/projeto-3-trimestre/backend/target/jorge-osorio-proj3t.war:/opt/wildfly/standalone/deployments/jorge-osorio-proj3t.war
      - /home/admin/projeto-3-trimestre/backend/.env:/opt/wildfly/bin/.env
      - /home/admin/projeto-3-trimestre/backend/logs:/opt/wildfly/logs
    env_file:
      - /home/admin/projeto-3-trimestre/backend/.env
    restart: unless-stopped
    networks:
      - proj3t-network
    depends_on:
      postgres_db:
        condition: service_healthy
      ai_service:
        condition: service_started
    hostname: backend

  ai_service:
    build:
      context: ./ai_microservice
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      # Production absolute paths
      - /home/admin/projeto-3-trimestre/ai_microservice:/app
      - ai_model_cache:/app/models/chatbot_cache
    restart: unless-stopped
    environment:
      - LOG_LEVEL=warning # Less verbose for production
      - HF_HOME=/app/models/chatbot_cache
    networks:
      - proj3t-network
    hostname: ai-service

  postgres_db:
    image: postgres:15
    environment:
      POSTGRES_DB: proj3t_db
      POSTGRES_USER: proj3t_user
      POSTGRES_PASSWORD: proj3t_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - proj3t-network
    hostname: postgres-db
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proj3t_user -d proj3t_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@localhost.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - proj3t-network
    depends_on:
      - postgres_db
    restart: unless-stopped

networks:
  proj3t-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local
  ai_model_cache:
    driver: local
