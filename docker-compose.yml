services:
  app:
    image: proj3twildfly:latest
    build:
      context: ./wildfly
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
      - "8443:8443"
      - "9990:9990"
    volumes:
      - ./backend/target/jorge-osorio-proj3t/:/opt/wildfly/standalone/deployments/jorge-osorio-proj3t.war
      - ./backend/.env:/opt/wildfly/standalone/.env
    env_file:
      - ./backend/.env
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ISSUER=${JWT_ISSUER}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - JAVA_OPTS=-DJWT_SECRET=${JWT_SECRET} -DJWT_ISSUER=${JWT_ISSUER} -DSMTP_HOST=${SMTP_HOST} -DSMTP_PORT=${SMTP_PORT} -DSMTP_USERNAME=${SMTP_USERNAME} -DSMTP_PASSWORD=${SMTP_PASSWORD}
    networks:
      - proj3t-network
    depends_on:
      postgres_db:
        condition: service_healthy
      ai_service:
        condition: service_started
    hostname: backend

  ai_service:
    build:
      context: ./ai_microservice
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./ai_microservice:/app
    restart: unless-stopped
    environment:
      - LOG_LEVEL=info
    networks:
      - proj3t-network
    hostname: ai-service

  postgres_db:
    image: postgres:15
    environment:
      POSTGRES_DB: proj3t_db
      POSTGRES_USER: proj3t_user
      POSTGRES_PASSWORD: proj3t_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - proj3t-network
    hostname: postgres-db
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proj3t_user -d proj3t_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@localhost.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - proj3t-network
    depends_on:
      - postgres_db
    restart: unless-stopped

networks:
  proj3t-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local
